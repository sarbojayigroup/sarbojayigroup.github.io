<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarbojayi Tourism | Trusted Tour Operator</title>

<meta name="description" content="Sarbojayi Tourism - Trusted Tour Operator from Kolkata. Domestic, International, Group, Honeymoon, Corporate and Customized Tours.">
<meta name="theme-color" content="#071a2f">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fb;
    color:#162235;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
}

/* ================= HEADER ================= */

.topbar{
    background:#061525;
    color:#fff;
    padding:12px 20px;
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
    font-size:14px;
}

.topbar a{
    color:#fff;
}

.header{
    background:#091b2f;
    color:#fff;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    border-bottom:1px solid rgba(255,255,255,.12);
}

.logo-box{
    width:90px;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo-box img{
    width:90px;
    height:90px;
    object-fit:contain;
    display:block;
}

.brand h1{
    font-size:25px;
    letter-spacing:1px;
}

.brand p{
    color:#d9b45a;
    letter-spacing:3px;
    font-size:12px;
    margin-top:4px;
}

/* ================= NAV ================= */

.nav{
    background:#0d2843;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    color:#fff;
    padding:9px 15px;
    border-radius:20px;
    font-size:14px;
}

.nav a:hover{
    background:#d9b45a;
    color:#08182a;
}

/* ================= LANGUAGE ================= */

.language{
    position:absolute;
    right:20px;
    top:15px;
    z-index:20;
    background:#0d2843;
    border:1px solid rgba(255,255,255,.3);
    padding:4px;
    border-radius:30px;
}

.language button{
    border:0;
    background:transparent;
    color:#fff;
    padding:9px 16px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

.language button.active{
    background:#fff;
    color:#14243a;
}

/* ================= HERO ================= */

.hero{
    min-height:650px;
    background:
    linear-gradient(rgba(4,22,37,.68),rgba(4,22,37,.72)),
    url("https://images.unsplash.com/photo-1524498250077-390f9e378fc0?auto=format&fit=crop&w=1800&q=85")
    center/cover no-repeat;

    color:#fff;
    display:flex;
    align-items:center;
    position:relative;
}

.hero-content{
    max-width:900px;
    padding:80px 7%;
}

.badge{
    display:inline-block;
    border:1px solid rgba(255,255,255,.4);
    padding:10px 22px;
    border-radius:30px;
    letter-spacing:2px;
    font-weight:bold;
    margin-bottom:28px;
}

.hero h2{
    font-size:clamp(42px,7vw,78px);
    line-height:1.02;
    margin-bottom:25px;
}

.hero h2 span{
    color:#ffd45b;
}

.hero p{
    max-width:700px;
    font-size:20px;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:15px 28px;
    border-radius:10px;
    font-weight:bold;
    display:inline-block;
    border:2px solid transparent;
}

.btn-primary{
    background:#fff;
    color:#092039;
}

.btn-whatsapp{
    background:#16c768;
    color:#fff;
}

/* ================= SECTIONS ================= */

section{
    padding:75px 6%;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:36px;
    color:#0a2037;
}

.section-title p{
    color:#667385;
    max-width:700px;
    margin:10px auto;
}

/* ================= SERVICES ================= */

.service-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
    max-width:1200px;
    margin:auto;
}

.service{
    background:#fff;
    padding:28px 18px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 8px 30px rgba(10,30,50,.08);
    transition:.3s;
}

.service:hover{
    transform:translateY(-6px);
}

.service-icon{
    font-size:38px;
    margin-bottom:12px;
}

.service h3{
    font-size:18px;
}

/* ================= DESTINATIONS ================= */

.destination-grid{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.destination{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
    cursor:pointer;
    transition:.3s;
}

.destination:hover{
    transform:translateY(-6px);
}

.destination-img{
    height:230px;
    background-size:cover;
    background-position:center;
    position:relative;
}

.destination-img::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(transparent,rgba(0,0,0,.75));
}

.destination-name{
    position:absolute;
    bottom:15px;
    left:18px;
    color:#fff;
    z-index:2;
    font-size:23px;
    font-weight:bold;
}

.destination-info{
    padding:20px;
}

.destination-info p{
    color:#697789;
    font-size:14px;
}

.more{
    margin-top:12px;
    color:#c08b18;
    font-weight:bold;
}

/* ================= WHY US ================= */

.why{
    background:#071a2f;
    color:#fff;
}

.why .section-title h2{
    color:#fff;
}

.why-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    text-align:center;
    padding:28px 15px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:15px;
}

.why-card .icon{
    font-size:35px;
    margin-bottom:12px;
}

.why-card h3{
    color:#ffd45b;
    margin-bottom:8px;
}

/* ================= FOUNDER ================= */

.founder{
    background:#fff;
}

.founder-box{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:320px 1fr;
    gap:45px;
    align-items:center;
}

.founder-photo{
    background:#eef2f6;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.founder-photo img{
    width:100%;
    display:block;
    object-fit:cover;
}

.founder-text h2{
    color:#0a2037;
    font-size:34px;
    margin-bottom:8px;
}

.founder-text h3{
    color:#c08b18;
    margin-bottom:20px;
}

.founder-text p{
    color:#596879;
    margin-bottom:15px;
}

/* ================= REVIEWS ================= */

.review-section{
    background:#f1f5f9;
}

.review-box{
    max-width:850px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:45px 25px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.review-box .stars{
    font-size:30px;
    margin-bottom:15px;
}

.review-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 25px;
    background:#4285f4;
    color:#fff;
    border-radius:10px;
    font-weight:bold;
}

/* ================= CONTACT ================= */

.contact{
    background:#fff;
}

.contact-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.contact-card{
    background:#f7f9fb;
    padding:30px;
    border-radius:18px;
}

.contact-card h3{
    margin-bottom:20px;
    color:#0b223a;
}

.contact-item{
    margin:15px 0;
}

.contact-item strong{
    display:block;
    color:#c08b18;
}

form input,
form textarea{
    width:100%;
    padding:14px;
    border:1px solid #d5dce4;
    border-radius:9px;
    margin-bottom:12px;
    font-family:inherit;
}

form textarea{
    min-height:120px;
}

form button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:9px;
    background:#16c768;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

/* ================= MAP ================= */

.map-button{
    display:inline-block;
    margin-top:15px;
    background:#0d
